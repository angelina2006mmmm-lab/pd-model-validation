name: Credit Risk Model Serving tests
on:
  push:
    paths:
      - 'extensions/credit-risk-model-serving/**'
      - '.github/workflows/credit-risk-model-serving.yml'
  pull_request:
    paths:
      - 'extensions/credit-risk-model-serving/**'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/credit-risk-model-serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m training.train_export
      - run: python -m pytest -q
