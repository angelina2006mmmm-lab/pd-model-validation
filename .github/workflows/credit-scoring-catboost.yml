name: Synthetic credit scoring - CatBoost
on:
  push:
    paths:
      - 'extensions/credit-risk-scoring-catboost/**'
      - '.github/workflows/credit-scoring-catboost.yml'
  pull_request:
    paths:
      - 'extensions/credit-risk-scoring-catboost/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/credit-risk-scoring-catboost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python -m creditrisk.experiment
