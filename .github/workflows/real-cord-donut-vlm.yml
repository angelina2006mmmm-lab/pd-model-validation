name: Real CORD receipts - Donut pretrained document VLM
on:
  push:
    paths:
      - 'extensions/document-vision-lab/docvision/real_cord_vlm.py'
      - 'extensions/document-vision-lab/tests/test_real_cord_vlm.py'
      - '.github/workflows/real-cord-donut-vlm.yml'
  workflow_dispatch:
jobs:
  real-receipt-vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: extensions/document-vision-lab
    env:
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install document VLM and dataset tools
        run: |
          python -m pip install 'transformers==4.50.3' 'timm>=1,<2' 'sentencepiece>=0.2,<1' 'protobuf>=4,<7' 'Pillow>=10,<13' 'pyarrow>=16,<23' 'huggingface_hub>=0.31,<1' 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Install Tesseract baseline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python -m pip install pytesseract
      - name: Unit-test field extraction and normalization
        run: python -m pytest -q tests/test_real_cord_vlm.py
      - name: Real OCR-free document VLM inference on CC BY 4.0 receipt scans
        run: python -m docvision.real_cord_vlm --n 20
      - uses: actions/upload-artifact@v4
        with:
          name: real-cord-pretrained-donut-vlm-metrics
          path: extensions/document-vision-lab/reports/cord_real_receipt_donut.json
